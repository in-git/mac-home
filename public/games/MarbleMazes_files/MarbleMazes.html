    <!--
      THE COLD OPEN — the app's first frame, and the only one that costs nothing.

      The entry bundle is ~1.1MB gz (71% of it Rapier's wasm, inlined as base64), and until this
      existed the <body> was a bare #root: the post rendered a black rectangle for the whole download,
      then finally painted a loading dot, then replaced it. The loading screen arrived once the
      loading was nearly done, which is the worst possible time for it.

      So the opening lives HERE, in markup and CSS, with no JS behind it at all. It paints as soon as
      the document and stylesheet land, long before a byte of the engine, and it keeps running whether
      the bundle takes 300ms or never arrives. Its tiles bloom from the centre outward on purpose:
      that is the same move the engine's own attract intro makes (INTRO_STAGGER in LabyrinthEngine),
      so the handoff reads as one continuous piece of motion rather than a spinner cutting to a game.

      Removed by dismissColdOpen() once the engine has actually rendered a frame; see coldOpen.ts.
      No inline <script> here by house rule (AGENTS.md) — none is needed, it is all CSS.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #060607;
        transition: opacity 420ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      /* Dismissal: faded by dismissColdOpen(), then removed from the DOM on transitionend. */
      #boot.boot-out {
        opacity: 0;
        pointer-events: none;
      }
      .boot-grid {
        position: relative; /* containing block for the marble */
        display: grid;
        grid-template-columns: repeat(5, 18px);
        grid-auto-rows: 18px;
        gap: 6px;
      }
      /* Base state is the VISIBLE one so that reduced motion (which index.css collapses to a 0.001ms
         single iteration) leaves a settled grid rather than 25 invisible tiles. */
      .boot-grid i {
        display: block;
        border-radius: 2px;
        background: #5a6fd4;
        opacity: 1;
        animation: bootTile 2400ms cubic-bezier(0.22, 1, 0.36, 1) var(--d, 0ms) infinite;
      }
      @keyframes bootTile {
        0% {
          opacity: 0;
          transform: translateY(7px) scale(0.7);
        }
        18% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        62% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(-4px) scale(0.86);
        }
      }
      /* The marble, already in motion before the game exists — it orbits the grid's centre on the
         same 2400ms period, so it reads as the thing the tiles are waking up for. */
      .boot-marble {
        position: absolute;
        left: 50%;
        top: 50%;
        margin: -9px 0 0 -9px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: radial-gradient(circle at 34% 30%, #e8eeff, #5a6fd4 68%, #33459b);
        box-shadow: 0 0 18px rgba(90, 111, 212, 0.55);
        animation: bootMarble 2400ms cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      /* ±42px keeps the orbit inside the 114px grid (5×18 + 4×6) with the marble's radius to spare */
      @keyframes bootMarble {
        0%,
        100% {
          transform: translate(42px, -42px);
        }
        25% {
          transform: translate(42px, 42px);
        }
        50% {
          transform: translate(-42px, 42px);
        }
        75% {
          transform: translate(-42px, -42px);
        }
      }
      .boot-mark {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #56565e;
        /* padding-left balances the trailing letter-space so the word stays optically centred */
        padding-left: 0.34em;
      }
    </style>
