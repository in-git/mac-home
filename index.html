  <style>
    /* 仅供屏幕阅读器与搜索引擎读取的标题：页面为桌面式 UI，无可见标题位 */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* JS 未执行时的首屏兜底内容，React 挂载后由应用界面接管 */
    #boot-fallback {
      max-width: 720px;
      margin: 12vh auto;
      padding: 0 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
        'Microsoft YaHei', sans-serif;
      color: #e6e6e6;
      line-height: 1.8;
    }

    #boot-fallback a {
      color: #7aa2f7;
    }

    #boot-fallback ul {
      padding-left: 20px;
    }

    /* 底部备案信息：固定在视口底部（桌面 UI 为 h-screen，普通文档流会被挤出首屏） */
    #site-footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px 14px;
      padding: 5px 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
        'Microsoft YaHei', sans-serif;
      font-size: 12px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.88);
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
      /* 容器不吃鼠标事件，避免遮挡桌面底部的可交互区域 */
      pointer-events: none;
    }

    #site-footer a {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: inherit;
      text-decoration: none;
    }

    #site-footer a:hover {
      text-decoration: underline;
    }

    #site-footer svg {
      flex: none;
    }
  </style>
</head>

<body>
  <!-- 全站唯一 h1：不随 React 渲染而消失，确保 Bing 渲染 JS 后仍能抓到主标题 -->
  <header class="sr-only">
    <h1>吴文龙的个人主页 · 游戏空间与互联空间</h1>
    <p>
      吴文龙的个人主页，是吴文龙自建的桌面式个人空间，包含游戏空间、互联空间、便签、天气、实时任务提醒与动态壁纸。
    </p>
  </header>

  <div id="root">
    <!-- 首屏静态兜底：无 JS 环境（含部分爬虫）下依然有可读内容 -->
    <main id="boot-fallback">
      <h2>吴文龙的个人主页</h2>
      <p>
        这里是由吴文龙搭建的个人桌面空间，把常用站点与日常工具整合在一起：
      </p>
      <ul>
        <li>游戏空间：吴文龙收藏与整理的游戏入口</li>
        <li>互联空间：吴文龙常用的网站与在线服务导航</li>
        <li>便签、天气、实时任务提醒与动态壁纸等桌面小组件</li>
      </ul>
      <p>页面正在加载，若长时间无响应，请检查浏览器是否已启用 JavaScript。</p>
    </main>
  </div>

  <noscript>
    <p style="padding: 16px; font-family: sans-serif">
      吴文龙的个人主页需要启用 JavaScript 才能完整体验，当前展示的是静态内容。
    </p>
  </noscript>

  <!-- 页面底部备案信息：写在静态 HTML 中，爬虫不执行 JS 也能抓取 -->
  <footer id="site-footer">

      </svg>
