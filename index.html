    /* 仅供屏幕阅读器与搜索引擎读取的标题：页面为桌面式 UI，无可见标题位 */
    .sr-only {

      pointer-events: none;

    /* 深色模式下反转为浅色文字 + 半透明黑底 */
    .dark #site-footer {

      background: rgba(0, 0, 0, 0.28);
