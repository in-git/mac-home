<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 用户上线对接测试</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #4ecca3; margin-bottom: 24px; font-size: 24px; }
        
        .config-panel { background: #16213e; border-radius: 12px; padding: 24px; margin-bottom: 20px; border: 1px solid #0f3460; }
        .config-row { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
        .config-item { flex: 1; min-width: 280px; }
        label { display: block; margin-bottom: 6px; color: #888; font-size: 13px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #0f3460; border-radius: 6px; background: #0f3460; color: #e0e0e0; font-size: 14px; }
        input:focus { outline: none; border-color: #4ecca3; }
        
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; }
        .btn-primary { background: #4ecca3; color: #1a1a2e; }
        .btn-primary:hover { background: #3db892; }
        .btn-primary:disabled { background: #555; color: #888; cursor: not-allowed; }
        .btn-danger { background: #e94560; color: white; }
        .btn-danger:hover { background: #d63851; }
        .btn-danger:disabled { background: #555; color: #888; cursor: not-allowed; }
        .btn-secondary { background: #533483; color: white; }
        .btn-secondary:hover { background: #6a44a6; }
        
        .status-bar { display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: #16213e; border-radius: 8px; margin-bottom: 20px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .status-disconnected { background: #e94560; }
        .status-connecting { background: #f5a623; }
        .status-connected { background: #4ecca3; }
        .status-text { font-size: 14px; }
        .status-info { margin-left: auto; font-size: 13px; color: #888; }
        
        .main-grid { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
        
        .panel { background: #16213e; border-radius: 12px; padding: 20px; border: 1px solid #0f3460; }
        .panel-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #4ecca3; display: flex; justify-content: space-between; align-items: center; }
        
        .subscription-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .subscription-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #0f3460; border-radius: 6px; font-size: 13px; }
        .subscription-item input { width: auto; flex: 1; background: transparent; border: none; color: #e0e0e0; }
        .subscription-item button { padding: 4px 10px; font-size: 12px; }
        .sub-check { width: 14px; height: 14px; }
        
        .log-container { height: 450px; overflow-y: auto; background: #0a0a1a; border-radius: 8px; padding: 12px; font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; }
        .log-entry { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #1a1a3a; }
        .log-header { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
        .log-time { color: #555; }
        .log-module { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .module-online { background: #4ecca3; color: #1a1a2e; }
        .module-welcome { background: #f5a623; color: #1a1a2e; }
        .module-system { background: #888; color: white; }
        .module-error { background: #e94560; color: white; }
        .log-type { color: #888; font-size: 11px; }
        .log-content { color: #ccc; white-space: pre-wrap; word-break: break-all; }
        
        .member-list { display: flex; flex-direction: column; gap: 8px; max-height: 350px; overflow-y: auto; }
        .member-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #0f3460; border-radius: 6px; }
        .member-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 14px; flex-shrink: 0; }
        .member-info { flex: 1; min-width: 0; }
        .member-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .member-meta { font-size: 12px; color: #888; }
        .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .badge-user { background: #4ecca3; color: #1a1a2e; }
        .badge-guest { background: #888; color: white; }
        
        .stats { display: flex; gap: 12px; margin-bottom: 16px; }
        .stat-card { flex: 1; padding: 12px; background: #0f3460; border-radius: 8px; text-align: center; }
        .stat-value { font-size: 24px; font-weight: bold; color: #4ecca3; }
        .stat-label { font-size: 12px; color: #888; margin-top: 4px; }
        
        .subscribe-template { display: flex; gap: 8px; margin-bottom: 12px; }
        .subscribe-template input { flex: 1; }
        
        .notice { padding: 10px 14px; background: #1a3a4a; border-left: 3px solid #4ecca3; border-radius: 4px; margin-bottom: 16px; font-size: 13px; color: #a0c4d4; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔌 WebSocket 用户上线对接测试</h1>
        
        <div class="config-panel">
            <div class="config-row">
                <div class="config-item">
                    <label>WebSocket 端点</label>
                    <input type="text" id="wsUrl" value="http://localhost:82/ws">
                </div>
                <div class="config-item">
                    <label>Token（可选，游客留空）</label>
                    <input type="text" id="token" placeholder="粘贴你的登录 token">
                </div>
            </div>
            <div class="btn-group">
                <button class="btn-primary" id="connectBtn" onclick="connect()">连接</button>
                <button class="btn-danger" id="disconnectBtn" onclick="disconnect()" disabled>断开</button>
                <button class="btn-secondary" onclick="clearLog()">清空日志</button>
            </div>
        </div>
        
        <div class="status-bar">
            <span class="status-dot status-disconnected" id="statusDot"></span>
            <span class="status-text" id="statusText">未连接</span>
            <span class="status-info" id="statusInfo"></span>
        </div>
        
        <div class="main-grid">
            <div class="panel">
                <div class="panel-title">
                    📝 消息日志
                    <span style="font-size: 12px; color: #888; font-weight: normal;" id="msgCount"></span>
                </div>
                <div class="log-container" id="logContainer"></div>
            </div>
            
            <div class="panel">
                <div class="panel-title">👥 在线成员</div>
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-value" id="userCount">0</div>
                        <div class="stat-label">已登录</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="guestCount">0</div>
                        <div class="stat-label">游客</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalCount">0</div>
                        <div class="stat-label">总计</div>
                    </div>
                </div>
                <div class="member-list" id="memberList"></div>
            </div>
        </div>
        
        <div class="panel" style="margin-top: 20px;">
            <div class="panel-title">📨 订阅管理</div>
            <div class="notice">预置了文档中的两个订阅主题，点击"订阅"即可接收对应消息。连接成功后会自动订阅勾选的主题。</div>
            <div class="subscription-list">
                <div class="subscription-item">
                    <input type="checkbox" class="sub-check" id="subOnlineBroadcast" checked>
                    <input type="text" value="/user/online/broadcast" readonly>
                    <button class="btn-primary" onclick="subscribe('/user/online/broadcast', 'online')">订阅</button>
                    <button class="btn-secondary" onclick="unsubscribe('/user/online/broadcast')">取消</button>
                </div>
                <div class="subscription-item">
                    <input type="checkbox" class="sub-check" id="subWelcomeQueue" checked>
                    <input type="text" value="/user/welcome/queue" readonly>
                    <button class="btn-primary" onclick="subscribe('/user/welcome/queue', 'welcome')">订阅</button>
                    <button class="btn-secondary" onclick="unsubscribe('/user/welcome/queue')">取消</button>
                </div>
            </div>
            <div class="subscribe-template">
                <input type="text" id="customDest" placeholder="自定义订阅目的地，如 /topic/chat/room1">
                <button class="btn-primary" onclick="subscribeCustom()">订阅</button>
                <button class="btn-secondary" onclick="unsubscribeCustom()">取消</button>
            </div>
        </div>
    </div>

    <!-- SockJS + STOMP (Spring Boot 经典搭配) -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    
    <script>
        // STOMP.js v5 API
        let stompClient = null;
        let connected = false;
        let reconnectTimer = null;
        let shouldReconnect = true;
        const subscribedDestinations = new Map(); // destination -> callback
        const members = new Map();
        let msgCount = 0;

        function updateStatus(status, text, info) {
            const dot = document.getElementById('statusDot');
            dot.className = 'status-dot';
            if (status === 'connected') dot.classList.add('status-connected');
            else if (status === 'connecting') dot.classList.add('status-connecting');
            else dot.classList.add('status-disconnected');
            document.getElementById('statusText').textContent = text;
            document.getElementById('statusInfo').textContent = info || '';
        }

        function updateButtons() {
            document.getElementById('connectBtn').disabled = connected;
            document.getElementById('disconnectBtn').disabled = !connected;
        }

        function log(message, module, type) {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString();
            let moduleClass = '';
            if (module === 'online') moduleClass = 'module-online';
            else if (module === 'welcome') moduleClass = 'module-welcome';
            else if (module === 'system') moduleClass = 'module-system';
            else if (module === 'error') moduleClass = 'module-error';
            
            entry.innerHTML = `
                <div class="log-header">
                    <span class="log-time">${time}</span>
                    ${module ? `<span class="log-module ${moduleClass}">${module}</span>` : ''}
                    ${type ? `<span class="log-type">${type}</span>` : ''}
                </div>
                <div class="log-content"></div>
            `;
            entry.querySelector('.log-content').textContent = typeof message === 'string' ? message : JSON.stringify(message, null, 2);
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
            msgCount++;
            document.getElementById('msgCount').textContent = `(${msgCount} 条消息)`;
        }

        function clearLog() {
            document.getElementById('logContainer').innerHTML = '';
            msgCount = 0;
            document.getElementById('msgCount').textContent = '';
        }

        function connect() {
            var wsUrl = document.getElementById('wsUrl').value.trim();
            var token = document.getElementById('token').value.trim();
            
            if (!wsUrl) { alert('请输入 WebSocket 端点'); return; }
            
            // SockJS 要求必须是 http/https 协议，自动把 ws/wss 转为 http/https
            var normalizedUrl = wsUrl.replace(/^ws:\/\//, 'http://').replace(/^wss:\/\//, 'https://');
            
            shouldReconnect = true;
            var url = token ? normalizedUrl + '?token=' + encodeURIComponent(token) : normalizedUrl;
            
            updateStatus('connecting', '连接中...', url);
            log('开始连接: ' + url, 'system');
            
            try {
                const socket = new SockJS(url);
                stompClient = Stomp.over(socket);
                
                stompClient.heartbeat.incoming = 10000;
                stompClient.heartbeat.outgoing = 10000;
                
                stompClient.connect({}, function(frame) {
                    connected = true;
                    updateStatus('connected', '已连接', '会话: ' + (frame.headers['session'] || '-'));
                    updateButtons();
                    log('STOMP 连接成功', 'system', 'connected');
                    
                    // 连接成功后订阅
                    setupSubscriptions();
                }, function(error) {
                    log('STOMP 连接失败: ' + (error.headers ? error.headers['message'] : error), 'error');
                    updateStatus('disconnected', '连接失败');
                    connected = false;
                    updateButtons();
                    scheduleReconnect();
                });
                
                // 监听 WebSocket 关闭（SockJS 底层）
                socket.onclose = function() {
                    if (connected) {
                        connected = false;
                        updateStatus('disconnected', '连接已关闭');
                        updateButtons();
                        log('连接已关闭', 'system', 'disconnected');
                        members.clear();
                        renderMembers();
                        if (shouldReconnect) scheduleReconnect();
                    }
                };
                
            } catch(e) {
                log('连接异常: ' + e.message, 'error');
                updateStatus('disconnected', '连接异常');
            }
        }

        function scheduleReconnect() {
            if (reconnectTimer) return;
            if (!shouldReconnect) return;
            log('5秒后尝试自动重连...', 'system');
            reconnectTimer = setTimeout(function() {
                reconnectTimer = null;
                if (shouldReconnect) connect();
            }, 5000);
        }

        function disconnect() {
            shouldReconnect = false;
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
            if (stompClient) {
                try {
                    stompClient.disconnect(function() {
                        log('已主动断开', 'system');
                    });
                } catch(e) {}
                stompClient = null;
            }
            connected = false;
            updateStatus('disconnected', '已断开');
            updateButtons();
            subscribedDestinations.clear();
        }

        function subscribe(destination, module) {
            if (!connected || !stompClient) { alert('请先连接'); return; }
            if (subscribedDestinations.has(destination)) { 
                log('已订阅: ' + destination, 'system');
                return; 
            }
            
            try {
                var callback = function(message) {
                    handleMessage(message.body, destination);
                };
                stompClient.subscribe(destination, callback);
                subscribedDestinations.set(destination, callback);
                log('已订阅: ' + destination, 'system', 'subscribe');
            } catch(e) {
                log('订阅失败: ' + e.message, 'error');
            }
        }

        function unsubscribe(destination) {
            if (!connected || !stompClient) return;
            try {
                stompClient.unsubscribe(destination);
                subscribedDestinations.delete(destination);
                log('已取消订阅: ' + destination, 'system', 'unsubscribe');
            } catch(e) {
                log('取消订阅异常: ' + e.message, 'error');
            }
        }

        function subscribeCustom() {
            var dest = document.getElementById('customDest').value.trim();
            if (!dest) { alert('请输入订阅目的地'); return; }
            subscribe(dest, 'custom');
        }

        function unsubscribeCustom() {
            var dest = document.getElementById('customDest').value.trim();
            if (!dest) return;
            unsubscribe(dest);
        }

        function handleMessage(body, destination) {
            var msg;
            try {
                msg = typeof body === 'string' ? JSON.parse(body) : body;
            } catch(e) {
                log('原始消息: ' + body, 'system');
                return;
            }
            
            var module = msg.module || 'unknown';
            var type = msg.type || '';
            log(msg, module, type);
            
            if (module === 'online') {
                handleOnlineMessage(msg);
            } else if (module === 'welcome') {
                handleWelcomeMessage(msg);
            }
        }

        function handleOnlineMessage(msg) {
            if (msg.data && msg.data.member) {
                var member = msg.data.member;
                if (msg.type === 'join') {
                    members.set(member.userKey, member);
                } else if (msg.type === 'leave') {
                    members.delete(member.userKey);
                }
                renderMembers();
            }
            if (msg.data && msg.data.stats) {
                updateStats(msg.data.stats);
            }
        }

        function handleWelcomeMessage(msg) {
            if (msg.data && msg.data.content) {
                log(msg.data.content, 'welcome', 'online');
            }
        }

        function renderMembers() {
            var list = document.getElementById('memberList');
            list.innerHTML = '';
            
            var userList = [];
            var guestList = [];
            
            members.forEach(function(m) {
                if (m.type === 'USER') userList.push(m);
                else guestList.push(m);
            });
            
            userList.concat(guestList).forEach(function(m) {
                var div = document.createElement('div');
                div.className = 'member-item';
                var name = m.type === 'USER' ? ((m.account && m.account.name) || m.userId || m.userKey) : m.userKey;
                var initial = (name || '?').charAt(0).toUpperCase();
                var isUser = m.type === 'USER';
                div.innerHTML = '<div class="member-avatar" style="background: ' + (isUser ? '#533483' : '#888') + '">' + initial + '</div>' +
                    '<div class="member-info">' +
                        '<div class="member-name">' + name + '</div>' +
                        '<div class="member-meta">' +
                            '<span class="badge ' + (isUser ? 'badge-user' : 'badge-guest') + '">' + m.type + '</span>' +
                            (m.userId ? 'ID: ' + m.userId : '') +
                        '</div>' +
                    '</div>';
                list.appendChild(div);
            });
            
            document.getElementById('userCount').textContent = userList.length;
            document.getElementById('guestCount').textContent = guestList.length;
            document.getElementById('totalCount').textContent = members.size;
        }

        function updateStats(stats) {
            if (stats.userCount !== undefined) document.getElementById('userCount').textContent = stats.userCount;
            if (stats.guestCount !== undefined) document.getElementById('guestCount').textContent = stats.guestCount;
            if (stats.total !== undefined) document.getElementById('totalCount').textContent = stats.total;
        }

        function setupSubscriptions() {
            if (document.getElementById('subOnlineBroadcast').checked) {
                subscribe('/user/online/broadcast', 'online');
            }
            if (document.getElementById('subWelcomeQueue').checked) {
                subscribe('/user/welcome/queue', 'welcome');
            }
        }

        // 初始化
        updateStatus('disconnected', '未连接');
        updateButtons();
        log('页面已加载，请点击"连接"按钮开始测试', 'system');
    </script>
</body>
</html>
